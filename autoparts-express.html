// ── HELPERS ──
function Badge({t,c}){
  const m={critical:{bg:"#450A0A",fc:"#EF4444"},high:{bg:"#431407",fc:"#FB923C"},medium:{bg:"#422006",fc:"#EAB308"},low:{bg:"#14532D",fc:"#22C55E"},in_progress:{bg:"#1E3A5F",fc:"#3B82F6"},waiting:{bg:"#422006",fc:"#EAB308"},done:{bg:"#14532D",fc:"#22C55E"},paid:{bg:"#14532D",fc:"#22C55E"},open:{bg:"#1E3A5F",fc:"#3B82F6"},overdue:{bg:"#450A0A",fc:"#EF4444"}};
  const s=m[c]||m[t]||{bg:C.surfaceHigh,fc:C.textMuted};
  return <span style={{background:s.bg,color:s.fc,borderRadius:6,padding:"2px 9px",fontSize:11,fontWeight:700}}>{t}</span>;
}
function Card({children,style={}}){return <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:12,padding:18,...style}}>{children}</div>;}
function Inp({value,onChange,placeholder,type="text",style={}}){
  return <input type={type} value={value} onChange={onChange} placeholder={placeholder}
    style={{background:C.bg,color:C.text,border:`1px solid ${C.border}`,borderRadius:8,padding:"9px 12px",fontSize:13,width:"100%",...style}}/>;
}
function Btn({children,onClick,variant="muted",style={}}){
  const bg=variant==="accent"?C.accent:variant==="danger"?"#7F1D1D":C.surfaceHigh;
  const fc=variant==="accent"||variant==="danger"?"#fff":C.textMuted;
  return <button onClick={onClick} style={{background:bg,color:fc,border:"none",borderRadius:8,padding:"9px 16px",cursor:"pointer",fontWeight:700,fontSize:13,...style}}>{children}</button>;
}
function Stat({label,value,sub,color}){
  return <Card style={{flex:1,minWidth:130}}>
    <div style={{color:C.textMuted,fontSize:11,fontWeight:700,letterSpacing:1,marginBottom:5}}>{label.toUpperCase()}</div>
    <div style={{color:color||C.text,fontSize:26,fontWeight:800,lineHeight:1}}>{value}</div>
    {sub&&<div style={{color:C.textMuted,fontSize:12,marginTop:4}}>{sub}</div>}
  </Card>;
}

// ── AI ──
async function callAI(system,user){
  const key=localStorage.getItem("ape_apikey")||"";
  if(!key) return "⚠ Kein API-Key gespeichert. Bitte unten links in der Sidebar den Key eintragen.";
  try{
    const r=await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "x-api-key":key,
        "anthropic-version":"2023-06-01",
        "anthropic-dangerous-direct-browser-access":"true"
      },
      body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1024,system,messages:[{role:"user",content:user}]})
    });
    const d=await r.json();
    if(d.error) return "⚠ API Fehler: "+d.error.message;
    return d.content?.map(b=>b.text||"").join("")||"Keine Antwort.";
  }catch(e){
    return "⚠ Verbindungsfehler: "+e.message;
  }
}

function AIView(){
  const [mode,setMode]=React.useState("obd");
  const [msgs,setMsgs]=React.useState([]);
  const [inp,setInp]=React.useState("");
  const [veh,setVeh]=React.useState({brand:"",model:"",year:""});
  const [loading,setLoading]=React.useState(false);

  React.useEffect(()=>bot.current?.scrollIntoView({behavior:"smooth"}),[msgs]);
  const brands=Object.keys(BRANDS).sort();
  const models=veh.brand?BRANDS[veh.brand]:[];

  async function send(){
    if(!inp.trim()||loading)return;
    const txt=inp.trim();setInp("");setLoading(true);
    setMsgs(p=>[...p,{r:"user",t:txt}]);
    const v=veh.brand?`Fahrzeug: ${veh.brand} ${veh.model} ${veh.year}
`:"";
    let sys="",prompt="";
    if(mode==="obd"){
      const code=txt.toUpperCase().match(/[PBCU][0-9]{4}/)?.[0];
      const loc=code?OBD[code]:null;
      sys="Du bist ein erfahrener Kfz-Mechatroniker. Antworte auf Deutsch, präzise und strukturiert. Gliedere: 1) Bedeutung 2) Wo liegt das Problem 3) Was prüfen/tauschen 4) Aufwand in Stunden und Euro (Schätzung).";
      prompt=loc?`${v}Fehlercode: ${code}
System: ${loc.s}
Beschreibung: ${loc.d}
Schweregrad: ${loc.sev}

Erkläre genau was das bedeutet, wo das Problem liegt und was zu tun ist.`:`${v}Fehlercode oder Symptom: ${txt}
Analysiere und gib eine detaillierte Diagnose.`;
    }else if(mode==="parts"){
      sys="Du bist ein Kfz-Teile-Experte. Antworte auf Deutsch. Nenne konkrete Teile, Marken (Brembo/Bosch/NGK/Mann/Bilstein), Preisrahmen und Montagehinweise.";
      prompt=`${v}Gesuchtes Teil / Problem: ${txt}
Welche Teile werden benötigt, welche Marken, Preisrahmen, Besonderheiten?`;
    }else{
      sys="Du bist Senior Kfz-Mechatroniker mit 20 Jahren Erfahrung. Antworte auf Deutsch, Schritt-für-Schritt, mit konkreten Prüfschritten.";
      prompt=`${v}Problem / Symptom: ${txt}
Systematische Diagnose-Anleitung mit Prüfschritten, geordnet nach Wahrscheinlichkeit.`;
    }
    const res=await callAI(sys,prompt);
    setMsgs(p=>[...p,{r:"ai",t:res}]);
    setLoading(false);
  }

  return <div style={{display:"flex",flexDirection:"column",gap:14}}>
    <div><h2 style={{color:C.text,fontSize:22,fontWeight:800,margin:0}}>🤖 KI-Assistent</h2>
    <div style={{color:C.textMuted,fontSize:13,marginTop:2}}>OBD-Codes · Teilesuche · Diagnose · Alle Fahrzeuge weltweit</div></div>
    <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
      {[["obd","🔴 OBD Fehlercode"],["parts","🔩 Teilesuche"],["diagnose","🔬 Diagnose-Hilfe"]].map(([id,label])=>
        <button key={id} onClick={()=>setMode(id)} style={{background:mode===id?C.accent:C.surfaceHigh,color:mode===id?"#fff":C.textMuted,border:"none",borderRadius:8,padding:"8px 16px",cursor:"pointer",fontWeight:700,fontSize:13}}>{label}</button>
      )}
    </div>
    <Card style={{padding:14}}>
      <div style={{color:C.textMuted,fontSize:11,fontWeight:700,marginBottom:8,letterSpacing:1}}>FAHRZEUG (OPTIONAL)</div>
      <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
        <select value={veh.brand} onChange={e=>setVeh({brand:e.target.value,model:"",year:""})}
          style={{flex:1,minWidth:120,background:C.bg,color:C.text,border:`1px solid ${C.border}`,borderRadius:8,padding:"9px 10px",fontSize:13}}>
          <option value="">Alle Marken</option>{brands.map(b=><option key={b}>{b}</option>)}

        <select value={veh.model} onChange={e=>setVeh(v=>({...v,model:e.target.value}))}

          <option value="">Alle Modelle</option>{models.map(m=><option key={m}>{m}</option>)}
        </select>
        <input value={veh.year} onChange={e=>setVeh(v=>({...v,year:e.target.value}))} placeholder="Bj. z.B. 2020"
          style={{width:105,background:C.bg,color:C.text,border:`1px solid ${C.border}`,borderRadius:8,padding:"9px 10px",fontSize:13}}/>
      </div>
    </Card>
    <Card style={{padding:0,display:"flex",flexDirection:"column"}}>
      <div style={{overflowY:"auto",maxHeight:380,padding:14,display:"flex",flexDirection:"column",gap:10,minHeight:200}}>

oder Symptom beschreiben..."}
          {mode==="parts"&&"Fahrzeug + Problem beschreiben
welches Teil wird gesucht..."}

KI gibt Schritt-für-Schritt Diagnose..."}

function Workshop({jobs,setJobs}){

  function add(){if(!nj.customer)return;setJobs(p=>[...p,{...nj,id:Date.now(),status:"waiting",price:+nj.price||0}]);setNj({customer:"",vehicle:"",plate:"",service:"",mechanic:"",start:"",est:"",price:""});setShowNew(false);}
  return <div style={{display:"flex",flexDirection:"column",gap:16}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8}}>
      <div><h2 style={{color:C.text,fontSize:22,fontWeight:800,margin:0}}>🔧 Werkstatt & Aufträge</h2>
      <div style={{color:C.textMuted,fontSize:13}}>{jobs.filter(j=>j.status!=="done").length} aktive Aufträge</div></div>
      <Btn variant="accent" onClick={()=>setShowNew(!showNew)}>+ Neuer Auftrag</Btn>
    </div>
    {showNew&&<Card style={{borderColor:C.accent}}>
      <div style={{color:C.text,fontWeight:700,marginBottom:12}}>Neuen Auftrag erstellen</div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
        {[["customer","Kunde *"],["vehicle","Fahrzeug *"],["plate","Kennzeichen"],["service","Leistung"],["mechanic","Mechaniker"],["start","Startzeit"],["est","Fertig ca."],["price","Preis (€)"]].map(([k,l])=>
          <Inp key={k} value={nj[k]} onChange={e=>setNj(p=>({...p,[k]:e.target.value}))} placeholder={l}/>
        )}
      </div>
      <div style={{display:"flex",gap:8,marginTop:10}}><Btn variant="accent" onClick={add}>Erstellen</Btn><Btn onClick={()=>setShowNew(false)}>Abbrechen</Btn></div>
    </Card>}
    {jobs.map(j=><Card key={j.id}>
      <div style={{display:"flex",justifyContent:"space-between",flexWrap:"wrap",gap:8,marginBottom:10}}>
        <div><div style={{color:C.text,fontWeight:700,fontSize:15}}>{j.customer}</div>
        <div style={{color:C.textMuted,fontSize:12}}>🚗 {j.vehicle} · {j.plate}</div></div>
        <div style={{display:"flex",alignItems:"center",gap:8}}><Badge t={sl[j.status]} c={j.status}/><span style={{color:C.accent,fontWeight:800,fontSize:16}}>€{j.price}</span></div>
      </div>
      <div style={{color:C.text,fontSize:13,marginBottom:6}}>🔩 {j.service}</div>
      <div style={{color:C.textMuted,fontSize:12,marginBottom:12}}>👤 {j.mechanic} · ⏰ {j.start}–{j.est}</div>
      <div style={{display:"flex",gap:6}}>
        {["waiting","in_progress","done"].map(s=><button key={s} onClick={()=>setJobs(p=>p.map(x=>x.id===j.id?{...x,status:s}:x))} style={{background:j.status===s?C.accent:C.surfaceHigh,color:j.status===s?"#fff":C.textMuted,border:"none",borderRadius:6,padding:"5px 12px",cursor:"pointer",fontSize:12,fontWeight:600}}>{sl[s]}</button>)}
      </div>
    </Card>)}

}

function Parts({parts,setParts}){
  const [search,setSearch]=React.useState("");
  const [showAdd,setShowAdd]=React.useState(false);
  const [np,setNp]=React.useState({name:"",sku:"",price:"",stock:"",min:"",brand:"",fit:""});
  const f=parts.filter(p=>p.name.toLowerCase().includes(search.toLowerCase())||p.sku.toLowerCase().includes(search.toLowerCase())||p.brand.toLowerCase().includes(search.toLowerCase()));
  function add(){if(!np.name||!np.sku)return;setParts(p=>[...p,{...np,id:Date.now(),price:+np.price||0,stock:+np.stock||0,min:+np.min||0}]);setNp({name:"",sku:"",price:"",stock:"",min:"",brand:"",fit:""});setShowAdd(false);}
  return <div style={{display:"flex",flexDirection:"column",gap:16}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8}}>
      <div><h2 style={{color:C.text,fontSize:22,fontWeight:800,margin:0}}>📦 Teile & Lager</h2>
      <div style={{color:C.textMuted,fontSize:13}}>{parts.length} Artikel</div></div>
      <Btn variant="accent" onClick={()=>setShowAdd(!showAdd)}>+ Neues Teil</Btn>
    </div>
    {showAdd&&<Card style={{borderColor:C.accent}}>
      <div style={{color:C.text,fontWeight:700,marginBottom:12}}>Neues Teil anlegen</div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
        {[["name","Bezeichnung *"],["sku","SKU *"],["brand","Marke"],["fit","Kompatibel mit"],["price","Preis (€)"],["stock","Bestand"],["min","Mindestbestand"]].map(([k,l])=>
          <Inp key={k} value={np[k]} onChange={e=>setNp(p=>({...p,[k]:e.target.value}))} placeholder={l}/>
        )}
      </div>
      <div style={{display:"flex",gap:8,marginTop:10}}><Btn variant="accent" onClick={add}>Speichern</Btn><Btn onClick={()=>setShowAdd(false)}>Abbrechen</Btn></div>
    </Card>}
    <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 Suchen (Name, SKU, Marke)..."
      style={{background:C.surface,color:C.text,border:`1px solid ${C.border}`,borderRadius:8,padding:"10px 14px",fontSize:14,width:"100%"}}/>
    <div style={{display:"flex",flexDirection:"column",gap:8}}>
      {f.map(p=><Card key={p.id} style={{padding:14}}>
        <div style={{display:"flex",justifyContent:"space-between",flexWrap:"wrap",gap:8}}>
          <div><div style={{color:C.text,fontWeight:700,fontSize:14}}>{p.name}</div>
          <div style={{color:C.textMuted,fontSize:12,marginTop:2}}>SKU: {p.sku} · {p.brand} · {p.fit}</div></div>
          <div style={{textAlign:"right"}}>
            <div style={{color:C.accent,fontWeight:800,fontSize:16}}>€{Number(p.price).toFixed(2)}</div>
            <div style={{color:p.stock<p.min?C.red:C.green,fontSize:12,fontWeight:700}}>{p.stock<p.min?"⚠ ":"✓ "}Bestand: {p.stock}</div>
          </div>
        </div>

      {!f.length&&<div style={{color:C.textMuted,textAlign:"center",padding:30}}>Keine Teile gefunden.</div>}
    </div>

function Customers(){
  const [custs,setCusts]=React.useState(CUSTS0);
  const [search,setSearch]=React.useState("");
  const [sel,setSel]=React.useState(null);
  const [showNew,setShowNew]=React.useState(false);
  const [nc,setNc]=React.useState({name:"",phone:"",email:"",vehicle:""});
  const f=custs.filter(c=>c.name.toLowerCase().includes(search.toLowerCase())||c.email?.includes(search));
  function add(){if(!nc.name)return;setCusts(p=>[...p,{...nc,id:Date.now(),vehicles:nc.vehicle?[nc.vehicle]:[]}]);setNc({name:"",phone:"",email:"",vehicle:""});setShowNew(false);}
  return <div style={{display:"flex",flexDirection:"column",gap:16}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8}}>
      <div><h2 style={{color:C.text,fontSize:22,fontWeight:800,margin:0}}>👥 Kunden & Fahrzeuge</h2>
      <div style={{color:C.textMuted,fontSize:13}}>{custs.length} Kunden</div></div>
      <Btn variant="accent" onClick={()=>setShowNew(!showNew)}>+ Neuer Kunde</Btn>
    </div>
    {showNew&&<Card style={{borderColor:C.accent}}>
      <div style={{color:C.text,fontWeight:700,marginBottom:12}}>Neuen Kunden anlegen</div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
        {[["name","Name *"],["phone","Telefon"],["email","E-Mail"],["vehicle","Fahrzeug"]].map(([k,l])=>
          <Inp key={k} value={nc[k]} onChange={e=>setNc(p=>({...p,[k]:e.target.value}))} placeholder={l}/>
        )}
      </div>
      <div style={{display:"flex",gap:8,marginTop:10}}><Btn variant="accent" onClick={add}>Speichern</Btn><Btn onClick={()=>setShowNew(false)}>Abbrechen</Btn></div>
    </Card>}
    <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 Kunden suchen..."
      style={{background:C.surface,color:C.text,border:`1px solid ${C.border}`,borderRadius:8,padding:"10px 14px",fontSize:14,width:"100%"}}/>
    {f.map(c=><Card key={c.id} style={{cursor:"pointer",borderColor:sel===c.id?C.accent:C.border}} onClick={()=>setSel(sel===c.id?null:c.id)}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <div><div style={{color:C.text,fontWeight:700}}>{c.name}</div>
        <div style={{color:C.textMuted,fontSize:12,marginTop:2}}>📞 {c.phone} · ✉ {c.email}</div></div>
        <div style={{color:C.textMuted,fontSize:12}}>🚗 {c.vehicles.length}</div>
      </div>
      {sel===c.id&&<div style={{marginTop:10,borderTop:`1px solid ${C.border}`,paddingTop:10}}>
        {c.vehicles.map((v,i)=><div key={i} style={{color:C.text,fontSize:13,padding:"4px 0",borderBottom:`1px solid ${C.border}`}}>🚗 {v}</div>)}
        {!c.vehicles.length&&<div style={{color:C.textMuted,fontSize:13}}>Kein Fahrzeug</div>}
      </div>}
    </Card>)}
  </div>;
}

function Invoices(){
  const [invs,setInvs]=React.useState(INV0);
  const [showNew,setShowNew]=React.useState(false);
  const [ni,setNi]=React.useState({customer:"",service:"",net:"",status:"open"});
  const sl={paid:"Bezahlt",open:"Offen",overdue:"Überfällig"};
  function add(){
    if(!ni.customer)return;
    const net=+ni.net||0,tax=+(net*0.19).toFixed(2),total=+(net+tax).toFixed(2);
    setInvs(p=>[{id:"RE-2025-"+String(p.length+42).padStart(3,"0"),customer:ni.customer,service:ni.service,date:new Date().toLocaleDateString("de-DE"),net,tax,total,status:ni.status},...p]);
    setNi({customer:"",service:"",net:"",status:"open"});setShowNew(false);
  }
  return <div style={{display:"flex",flexDirection:"column",gap:16}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8}}>
      <div><h2 style={{color:C.text,fontSize:22,fontWeight:800,margin:0}}>💶 Rechnungen</h2>
      <div style={{color:C.textMuted,fontSize:13}}>{invs.length} Rechnungen</div></div>
      <Btn variant="accent" onClick={()=>setShowNew(!showNew)}>+ Neue Rechnung</Btn>
    </div>
    <div style={{display:"flex",gap:12,flexWrap:"wrap"}}>
      <Stat label="Offen" value={"€"+invs.filter(i=>i.status==="open").reduce((s,i)=>s+i.total,0).toFixed(0)} color={C.blue}/>
      <Stat label="Überfällig" value={"€"+invs.filter(i=>i.status==="overdue").reduce((s,i)=>s+i.total,0).toFixed(0)} color={C.red}/>
      <Stat label="Bezahlt" value={"€"+invs.filter(i=>i.status==="paid").reduce((s,i)=>s+i.total,0).toFixed(0)} color={C.green}/>
    </div>
    {showNew&&<Card style={{borderColor:C.accent}}>
      <div style={{color:C.text,fontWeight:700,marginBottom:12}}>Neue Rechnung</div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
        <Inp value={ni.customer} onChange={e=>setNi(p=>({...p,customer:e.target.value}))} placeholder="Kunde *"/>
        <Inp value={ni.service} onChange={e=>setNi(p=>({...p,service:e.target.value}))} placeholder="Leistung"/>
        <Inp value={ni.net} onChange={e=>setNi(p=>({...p,net:e.target.value}))} placeholder="Nettobetrag (€)" type="number"/>
        <select value={ni.status} onChange={e=>setNi(p=>({...p,status:e.target.value}))}
          style={{background:C.bg,color:C.text,border:`1px solid ${C.border}`,borderRadius:8,padding:"9px 12px",fontSize:13}}>
          <option value="open">Offen</option><option value="paid">Bezahlt</option><option value="overdue">Überfällig</option>
        </select>
      </div>
      {ni.net&&<div style={{color:C.textMuted,fontSize:12,marginTop:6}}>MwSt 19%: €{(+ni.net*0.19).toFixed(2)} · Brutto: €{(+ni.net*1.19).toFixed(2)}</div>}
      <div style={{display:"flex",gap:8,marginTop:10}}><Btn variant="accent" onClick={add}>Erstellen</Btn><Btn onClick={()=>setShowNew(false)}>Abbrechen</Btn></div>
    </Card>}
    {invs.map(inv=><Card key={inv.id}>
      <div style={{display:"flex",justifyContent:"space-between",flexWrap:"wrap",gap:8}}>
        <div>
          <div style={{display:"flex",gap:8,alignItems:"center",marginBottom:4,flexWrap:"wrap"}}>
            <span style={{color:C.accent,fontWeight:700,fontSize:13}}>{inv.id}</span>
            <Badge t={sl[inv.status]} c={inv.status}/>
          </div>
          <div style={{color:C.text,fontWeight:600}}>{inv.customer}</div>
          <div style={{color:C.textMuted,fontSize:12,marginTop:2}}>{inv.service} · 📅 {inv.date}</div>
        </div>
        <div style={{textAlign:"right"}}>
          <div style={{color:C.text,fontWeight:800,fontSize:18}}>€{inv.total.toFixed(2)}</div>
          <div style={{color:C.textMuted,fontSize:11}}>Netto: €{inv.net.toFixed(2)} · MwSt: €{inv.tax.toFixed(2)}</div>
          <div style={{display:"flex",gap:4,marginTop:6,justifyContent:"flex-end"}}>
            {["open","paid","overdue"].map(s=><button key={s} onClick={()=>setInvs(p=>p.map(x=>x.id===inv.id?{...x,status:s}:x))} style={{background:inv.status===s?C.accent:C.surfaceHigh,color:inv.status===s?"#fff":C.textMuted,border:"none",borderRadius:5,padding:"3px 8px",cursor:"pointer",fontSize:11,fontWeight:600}}>{sl[s]}</button>)}
          </div>
        </div>
      </div>
    </Card>)}
  </div>;
}

// ── API KEY MANAGER ──
function KeyManager(){
  const [key,setKey]=React.useState(localStorage.getItem("ape_apikey")||"");
  const [saved,setSaved]=React.useState(!!localStorage.getItem("ape_apikey"));
  function save(){localStorage.setItem("ape_apikey",key);setSaved(true);setTimeout(()=>setSaved(false),2000);}
  return <div style={{padding:"10px 12px",borderTop:`1px solid ${C.border}`}}>
    <div style={{color:C.textMuted,fontSize:10,fontWeight:700,marginBottom:5,letterSpacing:1}}>ANTHROPIC API-KEY</div>
    <input type="password" value={key} onChange={e=>{setKey(e.target.value);setSaved(false);}}
      placeholder="sk-ant-..."
      style={{width:"100%",background:C.bg,color:C.text,border:`1px solid ${saved?C.green:C.border}`,borderRadius:6,padding:"6px 8px",fontSize:11}}/>
    <button onClick={save} style={{marginTop:5,width:"100%",background:saved?C.green:C.accent,color:"#fff",border:"none",borderRadius:6,padding:"5px",cursor:"pointer",fontSize:11,fontWeight:700}}>
      {saved?"✓ Gespeichert!":"Speichern"}
    </button>
    {saved&&<div style={{color:C.green,fontSize:10,marginTop:3,textAlign:"center"}}>KI ist bereit ✓</div>}
  </div>;
}

// ── APP ──
const NAV=[
  {id:"dashboard",e:"📊",l:"Dashboard"},
  {id:"ai",e:"🤖",l:"KI-Assistent"},
  {id:"workshop",e:"🔧",l:"Werkstatt"},

];

      case"appointments":return <Appointments/>;
      default:return <Dashboard jobs={jobs} parts={parts}/>;

      <div style={{padding:"18px 16px 14px",borderBottom:`1px solid ${C.border}`}}>
        <div style={{color:C.accent,fontWeight:900,fontSize:16}}>⚙ AUTOPARTS</div>
        <div style={{color:C.textMuted,fontSize:10,fontWeight:700,letterSpacing:2,marginTop:1}}>EXPRESS · KI-SYSTEM</div>
      </div>
      <div style={{flex:1,paddingTop:6,overflowY:"auto"}}>
        {NAV.map(v=><button key={v.id} onClick={()=>setView(v.id)} style={{

          borderLeft:`3px solid ${view===v.id?C.accent:"transparent"}`,
          color:view===v.id?C.text:C.textMuted,
          border:"none",borderLeftStyle:"solid",
          padding:"11px 16px",cursor:"pointer",fontSize:13,fontWeight:view===v.id?700:400,textAlign:"left",
        }}>
          <span style={{fontSize:15}}>{v.e}</span>{v.l}
          {v.id==="ai"&&<span style={{background:C.accent,color:"#fff",fontSize:9,fontWeight:900,borderRadius:4,padding:"1px 5px",marginLeft:"auto"}}>KI</span>}

    <div style={{marginLeft:205,flex:1,padding:24,overflowX:"hidden"}}>
      <V/>

}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
